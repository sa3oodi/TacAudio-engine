name: build

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag (e.g. v0.4.0) also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # needed to create the release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Configures, builds (Release), runs the unit tests, fetches the SADIE II heads and
      # compiles the installer. Fails if any test fails.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Generator "Visual Studio 17 2022"

      - uses: actions/upload-artifact@v4
        with:
          name: TacAudio-Setup
          path: dist/TacAudio-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TacAudio ${{ github.ref_name }}
          files: dist/TacAudio-Setup-*.exe
          body: |
            **Install:** download `TacAudio-Setup-*.exe` below and run it (per-user, no admin rights).
            The installer is not code-signed yet: if SmartScreen warns, click *More info -> Run anyway*.

            **Games need a one-time setup** with the free VB-CABLE (7.1) - see the
            [README](https://github.com/sa3oodi/TacAudio-engine#one-time-game-setup).

            Hotkeys: Ctrl+Alt+F10 on/off, Ctrl+Alt+F9 3D on/off.
