name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Configures, builds (Release), runs the unit tests, fetches the SADIE II heads and
      # compiles the installer. Fails if any test fails.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Generator "Visual Studio 17 2022"

      - uses: actions/upload-artifact@v4
        with:
          name: TacAudio-Setup
          path: dist/TacAudio-Setup-*.exe
