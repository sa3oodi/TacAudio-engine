name: build

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag (e.g. v0.4.0) also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: write         # needed to create the release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Configures (newest Visual Studio on the runner), builds (Release), runs the unit tests,
      # fetches the SADIE II heads and compiles the installer. Fails if any test fails; the
      # relevant log lines are then shown as annotations on the run page.
      - name: Build, test and package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build_installer.ps1 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern 'error|FAIL|failed|Exception|not found' |
              Select-Object -Last 12 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $code
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TacAudio-Setup
          path: dist/TacAudio-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TacAudio ${{ github.ref_name }}
          files: dist/TacAudio-Setup-*.exe
          body: |
            **Install:** download `TacAudio-Setup-*.exe` below and run it (per-user, no admin rights).
            The installer is not code-signed yet: if SmartScreen warns, click *More info -> Run anyway*.

            **One-time setup:** the Setup assistant installs TacAudio's engine on your headphones
            (one administrator prompt, no virtual cable), then set your game to 7.1 / Home theater -
            see the [README](https://github.com/sa3oodi/TacAudio-engine#one-time-setup-about-1-minute).

            Hotkeys: Ctrl+Alt+F10 on/off, Ctrl+Alt+F9 3D on/off.
